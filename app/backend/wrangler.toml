name = "lighthouse-api"
main = "src/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "lighthouse-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# KV Namespace (sessions / rate limiting)
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Environment variables (non-secret)
[vars]
FRONTEND_URL = "http://localhost:5173"
ENVIRONMENT = "development"

# ── Secrets (本番: wrangler secret put で設定) ──────────────────────────────
# ANTHROPIC_API_KEY  → wrangler secret put ANTHROPIC_API_KEY
# JWT_SECRET         → wrangler secret put JWT_SECRET
# RESEND_API_KEY     → wrangler secret put RESEND_API_KEY
#
# ── ローカル開発 (.dev.vars) ──────────────────────────────────────────────────
# app/backend/.dev.vars.example をコピーして .dev.vars を作成し、キーを設定する:
#   cp .dev.vars.example .dev.vars
#   # .dev.vars を編集して実キーを記入
# wrangler dev は .dev.vars を自動で読み込む（コミット不可）
